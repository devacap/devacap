<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Stile minimale vettoriale: tratto incrementato a stroke-width=32 -->
  <g fill="none" stroke="#000000" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Lettera M (posizionata in basso, centrata) -->
    <path d="M 160 420 L 160 220 L 250 330 L 340 220 L 340 420" />
    
    <!-- Lettera C capovolta a mezza luna (staccata, parte da sinistra a destra della M) -->
    <path d="M 100 230 C 100 80, 400 80, 400 230" />
    
  </g>
</svg>
